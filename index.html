<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soul Agency x MuyBruto | HQ v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F1F5F9; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .kanban-column { min-height: calc(100vh - 380px); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); }
        @keyframes subtle-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .animate-subtle { animation: subtle-bounce 3s infinite ease-in-out; }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyAsI1K6ukfJie1c5D1p_pGXQv6F4mFIoSg",
            authDomain: "soul-5b742.firebaseapp.com",
            projectId: "soul-5b742",
            storageBucket: "soul-5b742.firebasestorage.app",
            messagingSenderId: "712886103290",
            appId: "1:712886103290:web:de65db959c06d89d0aad43"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        // COLORES CON MÁS CONTRASTE PARA LECTURA FÁCIL
        const COLUMNS = [
            { id: 'Backlog', label: 'Buzón / Briefing', color: 'bg-slate-200/80', textColor: 'text-slate-600' },
            { id: 'In Production', label: 'En Producción', color: 'bg-blue-200/80', textColor: 'text-blue-700' },
            { id: 'Review', label: 'Revisión Partners', color: 'bg-amber-200/80', textColor: 'text-amber-700' },
            { id: 'Done', label: 'Completado', color: 'bg-emerald-200/80', textColor: 'text-emerald-700' }
        ];

        const PRODUCTORES = ['Oscar', 'Pablo', 'Externo'];
        const REVISORES = ['Manu', 'Álvaro', 'Silvia', 'Virginia'];
        const TODOS_USUARIOS = ['Oscar', 'Pablo', 'Manu', 'Álvaro', 'Silvia', 'Virginia', 'Externo'];

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={`${className}`} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [activeUser, setActiveUser] = useState(localStorage.getItem('soul_user') || 'Oscar');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedTask, setSelectedTask] = useState(null);
            const [rejectingTask, setRejectingTask] = useState(null);
            const [rejectFeedback, setRejectFeedback] = useState('');
            const [formatoLines, setFormatoLines] = useState(['']);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                localStorage.setItem('soul_user', activeUser);
                const init = async () => {
                    await auth.signInAnonymously();
                    const unsubscribe = db.collection('tasks')
                        .orderBy('createdAt', 'desc')
                        .onSnapshot(snap => {
                            setTasks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                            setLoading(false);
                        });
                    return () => unsubscribe();
                };
                init();
            }, [activeUser]);

            // ESTADÍSTICAS PARA EL DASHBOARD SUPERIOR
            const stats = useMemo(() => {
                const now = new Date();
                return {
                    total: tasks.filter(t => t.status !== 'Done').length,
                    review: tasks.filter(t => t.status === 'Review').length,
                    urgent: tasks.filter(t => {
                        if (t.status === 'Done') return false;
                        const diff = (new Date(t.deadline) - now) / (1000 * 60 * 60);
                        return diff > 0 && diff < 72;
                    }).length
                };
            }, [tasks]);

            const createProject = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newTask = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    client: formData.get('client'),
                    producer: 'Pendiente',
                    status: 'Backlog',
                    formats: formatoLines.filter(f => f.trim() !== ''),
                    deadline: formData.get('deadline'),
                    assetUrl: formData.get('assetUrl') || '',
                    comments: [],
                    createdAt: new Date().toISOString()
                };
                await db.collection('tasks').add(newTask);
                setIsModalOpen(false);
                setFormatoLines(['']);
            };

            const updateStatus = async (taskId, newStatus, assignedProducer = null, feedback = null) => {
                const updateData = { status: newStatus };
                if (assignedProducer) updateData.producer = assignedProducer;
                if (feedback) {
                    const log = `[${new Date().toLocaleDateString()}] ${activeUser}: ${feedback}`;
                    updateData.comments = firebase.firestore.FieldValue.arrayUnion(log);
                }
                await db.collection('tasks').doc(taskId).update(updateData);
                setRejectingTask(null);
                setRejectFeedback('');
            };

            const deleteTask = async (taskId) => {
                if (window.confirm("¿Estás seguro de que quieres eliminar este proyecto permanentemente?")) {
                    await db.collection('tasks').doc(taskId).delete();
                }
            };

            const isUrgent = (date) => {
                const diff = (new Date(date) - new Date()) / (1000 * 60 * 60);
                return diff > 0 && diff < 72;
            };

            if (loading) return <div className="h-screen flex flex-col items-center justify-center font-black uppercase tracking-widest text-slate-400 bg-slate-50">
                <div className="w-12 h-12 border-4 border-slate-200 border-t-black rounded-full animate-spin mb-4"></div>
                Cargando HQ...
            </div>;

            return (
                <div className="h-screen flex flex-col overflow-hidden bg-[#F1F5F9]">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between z-50 shadow-sm">
                        <div className="flex items-center gap-4">
                            <div className="bg-black p-2.5 rounded-xl text-white shadow-lg transform -rotate-2 flex items-center justify-center">
                                <Icon name="camera" size={20} />
                            </div>
                            <div>
                                <h1 className="text-lg font-black text-slate-800 tracking-tighter leading-none uppercase">The Soul Agency x MuyBruto</h1>
                                <p className="text-[9px] text-slate-400 font-black uppercase tracking-[0.3em] mt-1">PROYECT MANAGER</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3 bg-slate-100 px-4 py-2 rounded-2xl border border-slate-200 shadow-inner">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Usuario:</span>
                                <select 
                                    value={activeUser} 
                                    onChange={(e) => setActiveUser(e.target.value)}
                                    className="bg-transparent text-xs font-black text-slate-800 focus:outline-none cursor-pointer"
                                >
                                    {TODOS_USUARIOS.map(u => <option key={u}>{u}</option>)}
                                </select>
                            </div>
                            <button onClick={() => setIsModalOpen(true)} className="bg-black text-white px-6 py-3 rounded-2xl flex items-center gap-2 text-xs font-black uppercase tracking-widest hover:bg-slate-800 transition-all shadow-xl shadow-black/10 active:scale-95">
                                <Icon name="plus" size={14} /> Nuevo Briefing
                            </button>
                        </div>
                    </header>

                    {/* DASHBOARD RESUMEN PORTADA (ESTILO 7 DE MAYO) */}
                    <div className="grid grid-cols-3 gap-6 px-8 py-6">
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 flex items-center gap-5">
                            <div className="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-3xl">🚀</div>
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Proyectos Activos</p>
                                <p className="text-3xl font-black text-slate-800">{stats.total}</p>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 flex items-center gap-5">
                            <div className="w-14 h-14 bg-amber-50 rounded-2xl flex items-center justify-center text-3xl">👀</div>
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">En Revisión</p>
                                <p className="text-3xl font-black text-slate-800">{stats.review}</p>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-red-100 flex items-center gap-5 ring-4 ring-red-50">
                            <div className="w-14 h-14 bg-red-50 rounded-2xl flex items-center justify-center text-3xl animate-pulse">🔥</div>
                            <div>
                                <p className="text-[10px] font-black text-red-400 uppercase tracking-[0.2em]">Urgencias (&lt;72h)</p>
                                <p className="text-3xl font-black text-red-600">{stats.urgent}</p>
                            </div>
                        </div>
                    </div>

                    {}
                    <main className="flex-1 overflow-x-auto p-8 pt-2 flex gap-8 custom-scroll">
                        {COLUMNS.map(col => (
                            <div key={col.id} className={`flex-shrink-0 w-[340px] rounded-[2.5rem] ${col.color} p-6 border border-slate-300 shadow-inner flex flex-col kanban-column`}>
                                <div className="flex items-center justify-between mb-6 px-2">
                                    <h3 className={`text-[11px] font-black uppercase tracking-[0.25em] ${col.textColor}`}>{col.label}</h3>
                                    <span className="bg-white/80 px-3 py-1 rounded-full text-[10px] font-black text-slate-600 shadow-sm border border-white">
                                        {tasks.filter(t => t.status === col.id).length}
                                    </span>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scroll space-y-5 pr-1 pb-4">
                                    {tasks.filter(t => t.status === col.id).map(task => {
                                        const urgent = isUrgent(task.deadline);
                                        const canDelete = task.status === 'Backlog' || task.status === 'Done';
                                        
                                        return (
                                            <div key={task.id} className="bg-white p-5 rounded-[2rem] border border-slate-200 shadow-md hover:shadow-xl transition-all group relative overflow-hidden animate-in fade-in slide-in-from-bottom-4">
                                                {urgent && task.status !== 'Done' && <div className="absolute top-0 left-0 w-full h-1.5 bg-red-500 animate-pulse" />}
                                                
                                                {/* BOTÓN BORRAR RECUPERADO */}
                                                {canDelete && (
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }}
                                                        className="absolute top-4 right-4 w-7 h-7 bg-red-50 text-red-500 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all hover:bg-red-500 hover:text-white z-10"
                                                    >
                                                        <Icon name="trash-2" size={14} />
                                                    </button>
                                                )}

                                                <div className="flex justify-between items-start mb-3">
                                                    <span className={`text-[8px] font-black px-2.5 py-1 rounded-lg uppercase tracking-[0.15em] shadow-sm ${urgent && task.status !== 'Done' ? 'bg-red-600 text-white animate-subtle' : 'bg-slate-100 text-slate-500'}`}>
                                                        {urgent && task.status !== 'Done' ? 'Prioridad Crítica' : 'Estandar'}
                                                    </span>
                                                </div>

                                                <h4 className="text-sm font-black text-slate-800 leading-tight mb-4 pr-6 cursor-pointer hover:text-blue-600 transition-colors" onClick={() => setSelectedTask(task)}>
                                                    {task.title}
                                                </h4>

                                                <div className="flex flex-wrap gap-1.5 mb-5">
                                                    {task.formats?.slice(0,2).map((f, i) => (
                                                        <span key={i} className="bg-slate-50 text-[8px] font-black text-slate-400 px-2 py-1 rounded-md border border-slate-200 uppercase">{f}</span>
                                                    ))}
                                                    {task.formats?.length > 2 && <span className="text-[8px] font-black text-slate-300 px-1">+{task.formats.length - 2}</span>}
                                                </div>

                                                <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                                                    <div className={`flex items-center gap-1.5 text-[9px] font-black ${urgent && task.status !== 'Done' ? 'text-red-500' : 'text-slate-400'}`}>
                                                        <Icon name="calendar" size={10} /> {task.deadline}
                                                    </div>
                                                    <div className="flex -space-x-2">
                                                        <div className="w-7 h-7 rounded-lg bg-slate-900 border-2 border-white flex items-center justify-center text-[9px] font-black text-white" title={`Solicita: ${task.client}`}>{task.client?.[0]}</div>
                                                        <div className={`w-7 h-7 rounded-lg border-2 border-white flex items-center justify-center text-[9px] font-black text-white ${task.producer === 'Pendiente' ? 'bg-slate-200 text-slate-400' : 'bg-blue-600 shadow-lg shadow-blue-100'}`}>{task.producer?.[0]}</div>
                                                    </div>
                                                </div>

                                                {/* Botones de acción contextuales con RESTRICCIÓN OSCAR */}
                                                <div className="mt-5 space-y-2">
                                                    {task.status === 'Backlog' && (
                                                        activeUser === 'Oscar' ? (
                                                            <div className="grid grid-cols-3 gap-1.5">
                                                                {PRODUCTORES.map(p => (
                                                                    <button key={p} onClick={() => updateStatus(task.id, 'In Production', p)} className="bg-slate-900 text-white text-[8px] font-black py-2 rounded-xl hover:bg-blue-600 transition-all uppercase shadow-lg shadow-black/10">A {p}</button>
                                                                ))}
                                                            </div>
                                                        ) : (
                                                            <div className="bg-slate-50 py-2.5 rounded-xl border border-dashed border-slate-200 text-center">
                                                                <span className="text-[8px] font-black text-slate-300 uppercase tracking-widest">Esperando Asignación de Oscar</span>
                                                            </div>
                                                        )
                                                    )}
                                                    {task.status === 'In Production' && PRODUCTORES.includes(activeUser) && (
                                                        <button onClick={() => updateStatus(task.id, 'Review')} className="w-full bg-blue-600 text-white text-[9px] font-black py-3 rounded-2xl uppercase tracking-widest shadow-xl shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">Terminado - Enviar a Revisión</button>
                                                    )}
                                                    {task.status === 'Review' && REVISORES.includes(activeUser) && (
                                                        <div className="flex gap-2">
                                                            <button onClick={() => setRejectingTask(task)} className="flex-1 bg-red-50 text-red-600 border border-red-100 text-[9px] font-black py-3 rounded-2xl uppercase hover:bg-red-100">Ajustes</button>
                                                            <button onClick={() => updateStatus(task.id, 'Done')} className="flex-1 bg-emerald-600 text-white text-[9px] font-black py-3 rounded-2xl uppercase shadow-xl shadow-emerald-200 hover:bg-emerald-700">Aprobar OK</button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </main>

                    {}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <form onSubmit={createProject} className="bg-white rounded-[3.5rem] w-full max-w-xl shadow-2xl overflow-hidden border border-slate-200 animate-in zoom-in-95">
                                <div className="p-10 border-b border-slate-50 flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tighter uppercase">Nuevo Briefing</h2>
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="p-3 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-full transition-colors"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-10 space-y-6 max-h-[60vh] overflow-y-auto custom-scroll">
                                    <input name="title" required placeholder="Nombre del proyecto..." className="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold focus:ring-2 focus:ring-black focus:outline-none shadow-inner" />
                                    <textarea name="description" placeholder="Objetivo del proyecto / Estética buscada / Referencias..." className="w-full h-28 bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold focus:ring-2 focus:ring-black focus:outline-none resize-none shadow-inner" />
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Responsable Partner</label>
                                            <select name="client" className="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-black text-slate-700 focus:outline-none shadow-inner">
                                                {REVISORES.map(u => <option key={u}>{u}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Fecha de Entrega</label>
                                            <input name="deadline" type="date" required className="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-black focus:outline-none shadow-inner" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-3 block">Formatos Requeridos</label>
                                        <div className="space-y-3">
                                            {formatoLines.map((line, index) => (
                                                <input key={index} value={line} onChange={(e) => {
                                                    const newLines = [...formatoLines];
                                                    newLines[index] = e.target.value;
                                                    setFormatoLines(newLines);
                                                }} placeholder="Ej: Reels 9:16 / Estático / Carrusel..." className="w-full bg-slate-50 border border-slate-100 rounded-xl px-5 py-3 text-xs font-bold shadow-inner" />
                                            ))}
                                            <button type="button" onClick={() => setFormatoLines([...formatoLines, ''])} className="w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-[10px] font-black text-slate-400 hover:border-black hover:text-black transition-all">+ AÑADIR FORMATO</button>
                                        </div>
                                    </div>

                                    <input name="assetUrl" type="url" placeholder="Link a Carpeta de Recursos (Drive/Wetransfer)..." className="w-full bg-slate-50 border border-slate-100 rounded-2xl px-6 py-4 text-sm font-bold shadow-inner" />
                                </div>
                                <div className="p-10 bg-slate-50">
                                    <button type="submit" className="w-full bg-black text-white py-5 rounded-[2rem] text-xs font-black uppercase tracking-widest shadow-2xl hover:scale-[0.98] transition-transform shadow-black/20">Lanzar Orden a Producción</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Detalle de Tarea (Full View) */}
                    {selectedTask && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-in slide-in-from-bottom-12">
                                <div className="p-10 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800 tracking-tighter leading-tight uppercase">{selectedTask.title}</h2>
                                        <p className="text-[10px] font-black text-slate-400 uppercase mt-2 tracking-widest">Documento Técnico del Proyecto</p>
                                    </div>
                                    <button onClick={() => setSelectedTask(null)} className="p-4 hover:bg-slate-200 rounded-full transition-all text-slate-400"><Icon name="x" size={28}/></button>
                                </div>
                                <div className="p-12 space-y-10 overflow-y-auto custom-scroll">
                                    {selectedTask.description && (
                                        <div className="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden group">
                                            <div className="absolute right-[-10px] bottom-[-10px] text-white/5 opacity-20 transform -rotate-12 group-hover:rotate-0 transition-transform"><Icon name="file-text" size={140} /></div>
                                            <div className="flex items-center gap-3 mb-4 text-white/30 relative z-10">
                                                <Icon name="target" size={16} />
                                                <p className="text-[11px] font-black uppercase tracking-widest">Briefing de Producción</p>
                                            </div>
                                            <p className="text-sm font-medium leading-relaxed italic relative z-10">{selectedTask.description}</p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-100 p-6 rounded-3xl border border-slate-200">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Solicitado por</p>
                                            <p className="text-sm font-black text-slate-800 flex items-center gap-2"><Icon name="user" size={14} /> {selectedTask.client}</p>
                                        </div>
                                        <div className="bg-slate-100 p-6 rounded-3xl border border-slate-200">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Asignado a</p>
                                            <p className="text-sm font-black text-slate-800 flex items-center gap-2"><Icon name="layout" size={14} /> {selectedTask.producer}</p>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-4 ml-2">Formatos Finales</p>
                                        <div className="flex flex-wrap gap-2">
                                            {selectedTask.formats?.map((f, i) => (
                                                <span key={i} className="bg-white px-5 py-2.5 rounded-2xl border border-slate-200 text-xs font-black shadow-sm uppercase">{f}</span>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedTask.assetUrl && (
                                        <a href={selectedTask.assetUrl} target="_blank" className="block w-full bg-blue-600 text-white py-5 rounded-[2rem] text-center text-xs font-black uppercase tracking-widest hover:bg-black transition-all shadow-xl shadow-blue-200 flex items-center justify-center gap-3">
                                            <Icon name="external-link" size={16} /> Ver Materiales de Trabajo
                                        </a>
                                    )}

                                    <div className="space-y-4">
                                        <div className="flex items-center gap-2 mb-2 ml-2">
                                            <Icon name="message-square" size={16} className="text-amber-500" />
                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Historial de Feedback</span>
                                        </div>
                                        {selectedTask.comments && selectedTask.comments.length > 0 ? (
                                            selectedTask.comments.map((c, i) => (
                                                <div key={i} className="bg-amber-50 border border-amber-100 p-5 rounded-3xl text-[11px] font-bold text-slate-700 leading-relaxed italic relative pl-12">
                                                    <div className="absolute left-4 top-5 text-amber-300"><Icon name="corner-down-right" size={18} /></div>
                                                    {c}
                                                </div>
                                            ))
                                        ) : (
                                            <p className="text-[10px] font-black text-slate-300 italic text-center py-4 uppercase">Sin comentarios previos registrados</p>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal de Feedback Requerido */}
                    {rejectingTask && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-[120] p-4">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-md shadow-2xl p-10 border border-slate-200">
                                <h2 className="text-2xl font-black text-red-600 mb-2 uppercase tracking-tighter">Feedback / Ajustes</h2>
                                <p className="text-[10px] font-black text-slate-400 uppercase mb-8 tracking-widest">Instrucciones para el editor</p>
                                <textarea value={rejectFeedback} onChange={(e) => setRejectFeedback(e.target.value)} placeholder="¿Qué hay que cambiar? Sé específico..." className="w-full h-44 bg-slate-50 border border-slate-100 rounded-3xl p-6 text-sm font-bold focus:ring-2 focus:ring-red-500 outline-none resize-none mb-8 shadow-inner" />
                                <div className="flex gap-4">
                                    <button onClick={() => setRejectingTask(null)} className="flex-1 py-4 text-xs font-black uppercase text-slate-400 hover:text-slate-600 transition-colors">Cancelar</button>
                                    <button onClick={() => updateStatus(rejectingTask.id, 'In Production', null, rejectFeedback)} className="flex-[2] bg-red-600 text-white py-5 rounded-[2rem] text-xs font-black uppercase tracking-widest shadow-xl shadow-red-200 active:scale-95 transition-all">Devolver a Producción</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
