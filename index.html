<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soul Agency x MuyBruto | HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 50;
        }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = JSON.parse(__firebase_config);
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'soul-agency-app';
        const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        const USER_MAP = {
            "mquiroga@thesoul.agency": { name: "Manu", role: "REVISOR" },
            "o.noriegastudio@gmail.com": { name: "Oscar", role: "PRODUCTOR" },
            "alopez@thesoul.agency": { name: "Álvaro", role: "REVISOR" },
            "spina@thesoul.agency": { name: "Silvia", role: "REVISOR" },
            "vmartinez@thesoul.agency": { name: "Virginia", role: "REVISOR" }
        };

        const COLUMNS = [
            { id: 'Backlog', label: 'Buzón / Briefing', color: 'bg-slate-100/50' },
            { id: 'In Production', label: 'En Producción', color: 'bg-blue-50/50' },
            { id: 'Review', label: 'Revisión Partners', color: 'bg-amber-50/50' },
            { id: 'Done', label: 'Completado', color: 'bg-emerald-50/50' }
        ];

        const Icon = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>,
            Link: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>,
            Calendar: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"/></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            SoulLogo: () => (
                <div className="relative flex items-center justify-center p-2 bg-black rounded-xl shadow-lg">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M12 2l.3-.8c.2-.6.9-.9 1.5-.7l.8.3c.6.2.9.9.7 1.5l-.3.8" opacity="0.4" />
                        <rect x="4" y="8" width="16" height="11" rx="2" strokeWidth="2"/>
                        <path d="M9 8V6a1 1 0 011-1h4a1 1 0 011 1v2" strokeWidth="2" />
                        <circle cx="12" cy="13.5" r="3" strokeWidth="2" />
                    </svg>
                </div>
            )
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedTask, setSelectedTask] = useState(null);
            const [showUserPicker, setShowUserPicker] = useState(false);
            const [formFormats, setFormFormats] = useState(['']);
            const [actionModal, setActionModal] = useState({ show: false, type: null, task: null, comment: '' });

            useEffect(() => {
                const initAuth = async () => {
                    if (initialToken) await auth.signInWithCustomToken(initialToken);
                    else await auth.signInAnonymously();
                };
                initAuth();
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        const userProfile = u.email ? USER_MAP[u.email.toLowerCase()] : null;
                        if (userProfile) setProfile(userProfile);
                        else {
                            const saved = localStorage.getItem('soul_agency_user_name');
                            const found = Object.values(USER_MAP).find(v => v.name === saved);
                            setProfile(found || { name: "Invitado", role: "VISITANTE" });
                        }
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubscribe = db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('tasks')
                    .onSnapshot(snap => setTasks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))), err => console.error(err));
                return () => unsubscribe();
            }, [user]);

            const stats = useMemo(() => ({
                total: tasks.filter(t => t.status !== 'Done').length,
                review: tasks.filter(t => t.status === 'Review').length,
                urgent: tasks.filter(t => {
                    if (t.status === 'Done' || !t.deadline) return false;
                    const diff = (new Date(t.deadline) - new Date()) / (1000 * 60 * 60);
                    return diff > 0 && diff <= 72;
                }).length
            }), [tasks]);

            const selectProfile = (p) => {
                setProfile(p);
                localStorage.setItem('soul_agency_user_name', p.name);
                setShowUserPicker(false);
            };

            const createTask = async (e) => {
                e.preventDefault();
                const form = e.target;
                const newTask = {
                    title: form.title.value,
                    description: form.description.value,
                    client: form.client.value,
                    deadline: form.deadline.value,
                    assetUrl: form.assetUrl.value,
                    formats: formFormats.filter(f => f.trim() !== ''),
                    status: 'Backlog',
                    createdAt: new Date().toISOString(),
                    createdBy: profile.name,
                    producer: 'Pendiente',
                    logs: [{ user: profile.name, action: "creó el briefing", date: new Date().toISOString() }]
                };
                await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('tasks').add(newTask);
                setIsModalOpen(false);
                setFormFormats(['']);
            };

            const addFormatField = () => setFormFormats([...formFormats, '']);
            const updateFormatValue = (index, val) => {
                const updated = [...formFormats];
                updated[index] = val;
                setFormFormats(updated);
            };

            const deleteTask = async (id) => {
                if (window.confirm("¿Seguro que quieres borrar este proyecto?")) {
                    await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('tasks').doc(id).delete();
                }
            };

            const updateStatus = async (id, newStatus, producer = null, comment = '') => {
                const task = tasks.find(t => t.id === id);
                const newLogs = [...(task.logs || [])];
                let actionText = `movió a ${newStatus}`;
                if (comment) actionText += `: "${comment}"`;
                if (producer) actionText += ` (Asignado a ${producer})`;
                newLogs.push({ user: profile.name, action: actionText, date: new Date().toISOString() });

                const data = { status: newStatus, updatedAt: new Date().toISOString(), logs: newLogs };
                if (producer) data.producer = producer;
                await db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('tasks').doc(id).update(data);
                setActionModal({ show: false, type: null, task: null, comment: '' });
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-black uppercase text-slate-300 italic animate-pulse">Cargando HQ...</div>;

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* BARRA DE NAVEGACIÓN FIJA */}
                    <nav className="h-20 bg-white border-b flex justify-between items-center z-50 shrink-0 px-10 sticky-nav shadow-sm">
                        <div className="flex items-center gap-5">
                            <Icon.SoulLogo />
                            <div>
                                <h1 className="font-black text-sm tracking-tighter text-slate-800 uppercase leading-none">The Soul Agency X MuyBruto</h1>
                                <p className="text-[8px] font-black uppercase tracking-[0.4em] text-blue-500 mt-1">HQ WORKFLOW</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setShowUserPicker(!showUserPicker)}>
                                <div className="text-right">
                                    <p className="text-[8px] font-black uppercase text-slate-400 mb-0.5">{profile?.role}</p>
                                    <p className="text-xs font-black text-slate-800">{profile?.name} ▾</p>
                                </div>
                                <div className="w-9 h-9 rounded-xl bg-slate-900 flex items-center justify-center text-[10px] font-black text-white">{profile?.name?.[0]}</div>
                            </div>
                            {profile?.role === 'REVISOR' && (
                                <button onClick={() => setIsModalOpen(true)} className="bg-black text-white px-6 py-3 rounded-xl text-[9px] font-black uppercase tracking-widest hover:bg-blue-600 transition-all flex items-center gap-2">
                                    <Icon.Plus /> Nuevo Briefing
                                </button>
                            )}
                        </div>
                    </nav>

                    {/* ZONA DE SCROLL GENERAL */}
                    <div className="flex-1 overflow-y-auto custom-scroll">
                        
                        {/* CAJAS DE ESTADO: Se ocultan al bajar el scroll */}
                        <div className="px-10 py-8 flex gap-6">
                            <div className="flex-1 bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm transition-transform hover:scale-[1.01]">
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Activos</p>
                                <h2 className="text-3xl font-black text-slate-800">{stats.total}</h2>
                            </div>
                            <div className="flex-1 bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm transition-transform hover:scale-[1.01]">
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">En Revisión</p>
                                <h2 className="text-3xl font-black text-amber-500">{stats.review}</h2>
                            </div>
                            <div className="flex-1 bg-white p-6 rounded-[2.5rem] border border-slate-100 shadow-sm transition-transform hover:scale-[1.01]">
                                <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">Urgentes</p>
                                <h2 className="text-3xl font-black text-red-500">{stats.urgent}</h2>
                            </div>
                        </div>

                        {/* TABLERO KANBAN */}
                        <div className="px-10 pb-12 flex gap-8 items-start overflow-x-auto custom-scroll min-h-[70vh]">
                            {COLUMNS.map(col => (
                                <div key={col.id} className={`${col.color} min-w-[340px] w-[340px] rounded-[3.5rem] border border-slate-200/50 flex flex-col p-7`}>
                                    <div className="flex justify-between items-center mb-6 px-3">
                                        <h3 className="text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">{col.label}</h3>
                                        <span className="bg-white px-3 py-1 rounded-xl text-[9px] font-black text-slate-400 shadow-sm">{tasks.filter(t => t.status === col.id).length}</span>
                                    </div>

                                    {/* LISTA DE CARDS */}
                                    <div className="space-y-5">
                                        {tasks.filter(t => t.status === col.id).map(task => {
                                            const urgent = !task.status.includes('Done') && task.deadline && (new Date(task.deadline) - new Date()) / (1000 * 60 * 60) <= 72;
                                            return (
                                                <div key={task.id} className={`bg-white p-6 rounded-[2.2rem] border shadow-sm group relative hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer ${urgent && task.status !== 'Done' ? 'ring-2 ring-red-100 border-red-200' : 'border-slate-100'}`} onClick={() => setSelectedTask(task)}>
                                                    
                                                    {/* BOTÓN ELIMINAR */}
                                                    {(task.status === 'Backlog' || task.status === 'Done') && profile?.role === 'REVISOR' && (
                                                        <button onClick={(e) => { e.stopPropagation(); deleteTask(task.id); }} className="absolute top-4 right-4 p-2 text-slate-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100">
                                                            <Icon.Trash />
                                                        </button>
                                                    )}

                                                    <div className="flex justify-between items-start mb-4 pr-6">
                                                        <span className={`text-[8px] font-black px-2.5 py-1 rounded-lg uppercase ${urgent && task.status !== 'Done' ? 'bg-red-500 text-white' : 'bg-slate-100 text-slate-400'}`}>
                                                            {urgent && task.status !== 'Done' ? 'Urgente' : 'Standard'}
                                                        </span>
                                                        <div className="text-[9px] font-black text-slate-400 uppercase tracking-tighter">{task.client}</div>
                                                    </div>

                                                    <h4 className="font-black text-slate-800 text-sm mb-3 leading-tight uppercase">{task.title}</h4>
                                                    
                                                    <div className="flex flex-wrap gap-1.5 mb-5">
                                                        {task.formats?.map((f, i) => <span key={i} className="text-[8px] font-black bg-slate-50 text-slate-500 px-2 py-1 rounded-md uppercase border border-slate-100">{f}</span>)}
                                                    </div>

                                                    <div className="flex justify-between items-center pt-4 border-t border-slate-50">
                                                        <div className="flex items-center gap-1.5 text-slate-400 text-[9px] font-black">
                                                            <Icon.Calendar /> {task.deadline || 'S/F'}
                                                        </div>
                                                        
                                                        {/* ACCIONES DIRECTAS */}
                                                        <div className="flex gap-2" onClick={e => e.stopPropagation()}>
                                                            {task.status === 'Backlog' && profile?.name === 'Oscar' && (
                                                                <div className="flex gap-1">
                                                                    <button onClick={() => updateStatus(task.id, 'In Production', 'Oscar')} className="bg-slate-900 text-white px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase hover:bg-blue-600">A Oscar</button>
                                                                    <button onClick={() => updateStatus(task.id, 'In Production', 'Pablo')} className="bg-slate-900 text-white px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase hover:bg-blue-600">A Pablo</button>
                                                                    <button onClick={() => updateStatus(task.id, 'In Production', 'Externo')} className="bg-slate-900 text-white px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase hover:bg-blue-600">Externo</button>
                                                                </div>
                                                            )}
                                                            {task.status === 'In Production' && (profile?.name === task.producer || profile?.name === 'Oscar') && (
                                                                <button onClick={() => setActionModal({ show: true, type: 'SEND_REVIEW', task, comment: '' })} className="bg-amber-500 text-white px-4 py-1.5 rounded-lg text-[8px] font-black uppercase shadow-lg shadow-amber-100">Entregar</button>
                                                            )}
                                                            {task.status === 'Review' && profile?.role === 'REVISOR' && (
                                                                <div className="flex gap-1">
                                                                    <button onClick={() => setActionModal({ show: true, type: 'REJECT', task, comment: '' })} className="bg-red-50 text-red-500 px-2.5 py-1.5 rounded-lg text-[8px] font-black uppercase hover:bg-red-500 hover:text-white transition-colors">Ajustes</button>
                                                                    <button onClick={() => updateStatus(task.id, 'Done', null, 'Aprobado')} className="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[8px] font-black uppercase shadow-lg shadow-emerald-100">OK</button>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* MODAL CREAR BRIEFING */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4 z-[100]">
                            <form onSubmit={createTask} className="bg-white p-10 rounded-[3rem] w-full max-w-xl max-h-[90vh] overflow-y-auto custom-scroll border border-slate-100 shadow-2xl">
                                <div className="flex justify-between items-center mb-8">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><Icon.Plus /></div>
                                        <h2 className="text-2xl font-black text-slate-800 tracking-tighter uppercase">Nuevo Briefing</h2>
                                    </div>
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="text-slate-300 hover:text-red-500 transition-colors"><Icon.X /></button>
                                </div>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block ml-1">Título</label>
                                        <input name="title" required className="w-full p-5 bg-slate-50 rounded-2xl font-bold text-sm outline-none border border-transparent focus:border-blue-100" placeholder="Nombre del proyecto..." />
                                    </div>

                                    <div>
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block ml-1">Descripción / Brief</label>
                                        <textarea name="description" className="w-full h-32 p-5 bg-slate-900 text-slate-200 rounded-2xl font-medium text-sm outline-none resize-none" placeholder="Explica qué necesitamos..." />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block ml-1">Revisor</label>
                                            <select name="client" className="w-full p-5 bg-slate-50 rounded-2xl font-black text-sm outline-none">
                                                <option>Manu</option><option>Álvaro</option><option>Silvia</option><option>Virginia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block ml-1">Deadline</label>
                                            <input name="deadline" type="date" required className="w-full p-5 bg-slate-50 rounded-2xl font-black text-sm outline-none" />
                                        </div>
                                    </div>

                                    {/* LÍNEAS DE FORMATO RECUPERADAS */}
                                    <div>
                                        <div className="flex justify-between items-center mb-3 ml-1">
                                            <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest">Materiales a incluir</label>
                                            <button type="button" onClick={addFormatField} className="text-[8px] font-black bg-blue-50 text-blue-600 px-2 py-1 rounded-md uppercase">+ Añadir Línea</button>
                                        </div>
                                        <div className="space-y-2">
                                            {formFormats.map((fmt, idx) => (
                                                <input key={idx} value={fmt} onChange={(e) => updateFormatValue(idx, e.target.value)} className="w-full p-4 bg-slate-50 rounded-xl text-xs font-bold border border-transparent focus:border-blue-100 outline-none" placeholder={`Ej: Master 16:9, Redimensionado 9:16...`} />
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[9px] font-black uppercase text-slate-400 tracking-widest mb-2 block ml-1">URL Recursos</label>
                                        <input name="assetUrl" type="url" className="w-full p-5 bg-slate-50 rounded-2xl text-[10px] font-bold outline-none" placeholder="https://drive.google.com/..." />
                                    </div>

                                    <button type="submit" className="w-full bg-black text-white py-6 rounded-[2rem] font-black text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-blue-600 transition-all">Enviar Briefing</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL DETALLE PROYECTO */}
                    {selectedTask && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-6 z-[110]" onClick={() => setSelectedTask(null)}>
                            <div className="bg-white rounded-[3.5rem] w-full max-w-5xl shadow-2xl overflow-hidden flex h-[85vh] animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                                <div className="flex-1 p-12 overflow-y-auto custom-scroll">
                                    <div className="flex justify-between items-start mb-10">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-blue-500 tracking-widest mb-2">{selectedTask.client}</p>
                                            <h2 className="text-4xl font-black text-slate-800 tracking-tighter uppercase leading-tight">{selectedTask.title}</h2>
                                        </div>
                                        <button onClick={() => setSelectedTask(null)} className="p-3 bg-slate-50 rounded-2xl text-slate-400 hover:text-red-500 transition-colors"><Icon.X /></button>
                                    </div>
                                    
                                    <div className="bg-slate-900 text-white p-10 rounded-[2.5rem] mb-10">
                                        <p className="text-sm font-medium italic leading-relaxed text-slate-300">{selectedTask.description}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-10">
                                        <div>
                                            <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Materiales / Formatos</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {selectedTask.formats?.map((f, i) => (
                                                    <span key={i} className="bg-slate-50 text-slate-600 px-4 py-2 rounded-xl text-xs font-black border border-slate-100 uppercase">{f}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Materiales</h4>
                                            {selectedTask.assetUrl ? (
                                                <a href={selectedTask.assetUrl} target="_blank" className="flex items-center justify-center gap-3 bg-blue-600 text-white px-8 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-blue-700 transition-all">Abrir Link <Icon.Link /></a>
                                            ) : (
                                                <div className="p-5 border-2 border-dashed border-slate-100 rounded-2xl text-slate-300 text-[10px] font-black uppercase text-center">Sin link</div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="w-80 bg-slate-50/50 p-10 flex flex-col border-l border-slate-100">
                                    <h3 className="text-[10px] font-black uppercase mb-8 tracking-widest text-slate-400">Log de Actividad</h3>
                                    <div className="flex-1 overflow-y-auto custom-scroll space-y-8 pr-2">
                                        {selectedTask.logs?.slice().reverse().map((log, i) => (
                                            <div key={i} className="relative pl-6 border-l-2 border-slate-200">
                                                <div className="absolute -left-[5px] top-0 w-2 h-2 rounded-full bg-slate-300"></div>
                                                <p className="text-[9px] font-black uppercase text-slate-800">{log.user}</p>
                                                <p className="text-[11px] text-slate-500 leading-tight mt-1.5 font-medium">{log.action}</p>
                                                <p className="text-[8px] font-bold text-slate-300 mt-2">{new Date(log.date).toLocaleDateString()} {new Date(log.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL FEEDBACK / ENTREGA */}
                    {actionModal.show && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-[200]">
                            <div className="bg-white rounded-[3rem] p-10 w-full max-w-lg shadow-2xl">
                                <h3 className="text-2xl font-black text-slate-800 tracking-tighter mb-4 uppercase">{actionModal.type === 'SEND_REVIEW' ? '🚀 Entrega' : '🛑 Ajustes'}</h3>
                                <textarea className="w-full h-32 bg-slate-50 rounded-2xl p-6 text-sm font-medium border-2 border-transparent focus:border-blue-100 outline-none mb-6 resize-none" placeholder="Escribe tus comentarios aquí..." value={actionModal.comment} onChange={(e) => setActionModal({...actionModal, comment: e.target.value})} />
                                <div className="flex gap-4">
                                    <button onClick={() => setActionModal({show: false})} className="flex-1 py-5 text-[10px] font-black uppercase text-slate-400">Cancelar</button>
                                    <button onClick={() => updateStatus(actionModal.task.id, actionModal.type === 'SEND_REVIEW' ? 'Review' : 'In Production', null, actionModal.comment)} className={`flex-1 py-5 rounded-2xl text-[10px] font-black uppercase text-white shadow-lg ${actionModal.type === 'SEND_REVIEW' ? 'bg-amber-500' : 'bg-red-500'}`}>Enviar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SELECTOR DE USUARIO */}
                    {showUserPicker && (
                        <div className="absolute top-20 right-8 bg-white border border-slate-100 shadow-2xl rounded-3xl p-6 z-[100] w-64 animate-in fade-in slide-in-from-top-4 duration-200">
                            <p className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Cambiar Perfil</p>
                            {Object.values(USER_MAP).map((p, i) => (
                                <button key={i} onClick={() => selectProfile(p)} className="w-full text-left p-3 rounded-xl hover:bg-slate-50 flex items-center justify-between group mb-1">
                                    <span className="text-xs font-black text-slate-700">{p.name}</span>
                                    <span className="text-[8px] font-black uppercase text-slate-300">{p.role}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
