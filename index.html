<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soul Agency x MuyBruto | HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .kanban-column { min-height: calc(100vh - 250px); }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyAsI1K6ukfJie1c5D1p_pGXQv6F4mFIoSg",
            authDomain: "soul-5b742.firebaseapp.com",
            projectId: "soul-5b742",
            storageBucket: "soul-5b742.firebasestorage.app",
            messagingSenderId: "712886103290",
            appId: "1:712886103290:web:de65db959c06d89d0aad43"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        const COLUMNS = [
            { id: 'Backlog', label: 'Buzón / Briefing', color: 'bg-slate-100/50' },
            { id: 'In Production', label: 'En Producción', color: 'bg-blue-50/50' },
            { id: 'Review', label: 'Revisión Partners', color: 'bg-amber-50/50' },
            { id: 'Done', label: 'Completado', color: 'bg-emerald-50/50' }
        ];

        const PRODUCTORES = ['Oscar', 'Pablo', 'Externo'];
        const REVISORES = ['Manu', 'Álvaro', 'Silvia', 'Virginia'];

        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={`${className}`} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [tasks, setTasks] = useState([]);
            const [activeUser, setActiveUser] = useState(localStorage.getItem('soul_user') || 'Oscar');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedTask, setSelectedTask] = useState(null);
            const [rejectingTask, setRejectingTask] = useState(null);
            const [rejectFeedback, setRejectFeedback] = useState('');
            const [formatoLines, setFormatoLines] = useState(['']);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                localStorage.setItem('soul_user', activeUser);
                
                const init = async () => {
                    try {
                        await auth.signInAnonymously();
                        const unsubscribe = db.collection('tasks')
                            .orderBy('createdAt', 'desc')
                            .onSnapshot(snap => {
                                const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setTasks(data);
                                setLoading(false);
                            }, err => {
                                console.error(err);
                                setError("Error de Firestore: Asegúrate de que Cloud Firestore esté habilitado en modo prueba.");
                                setLoading(false);
                            });
                        return () => unsubscribe();
                    } catch (e) {
                        setError("Error de Autenticación: Habilita 'Anónimo' en Firebase Auth.");
                        setLoading(false);
                    }
                };
                init();
            }, [activeUser]);

            const createProject = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const newTask = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    client: formData.get('client'),
                    producer: 'Pendiente',
                    status: 'Backlog',
                    formats: formatoLines.filter(f => f.trim() !== ''),
                    deadline: formData.get('deadline'),
                    assetUrl: formData.get('assetUrl') || '',
                    comments: [],
                    createdAt: new Date().toISOString()
                };
                await db.collection('tasks').add(newTask);
                setIsModalOpen(false);
                setFormatoLines(['']);
            };

            const updateStatus = async (taskId, newStatus, assignedProducer = null, feedback = null) => {
                const updateData = { status: newStatus };
                if (assignedProducer) updateData.producer = assignedProducer;
                if (feedback) {
                    const log = `[${new Date().toLocaleDateString()}] ${activeUser}: ${feedback}`;
                    updateData.comments = firebase.firestore.FieldValue.arrayUnion(log);
                }
                await db.collection('tasks').doc(taskId).update(updateData);
                setRejectingTask(null);
                setRejectFeedback('');
            };

            const isUrgent = (date) => {
                const diff = (new Date(date) - new Date()) / (1000 * 60 * 60);
                return diff > 0 && diff < 72;
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-black uppercase tracking-widest text-slate-400 animate-pulse">Iniciando HQ...</div>;

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {}
                    <header className="bg-white border-b border-slate-200 px-8 py-5 flex items-center justify-between z-50">
                        <div className="flex items-center gap-4">
                            <div className="bg-black p-2.5 rounded-xl text-white font-black text-xl shadow-lg transform -rotate-2">SA</div>
                            <div>
                                <h1 className="text-xl font-black text-slate-800 tracking-tighter leading-none">THE SOUL AGENCY HQ</h1>
                                <p className="text-[9px] text-slate-400 font-black uppercase tracking-[0.3em] mt-1">Workflow Tool</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3 bg-slate-50 px-4 py-2 rounded-2xl border border-slate-100">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Sesión:</span>
                                <select 
                                    value={activeUser} 
                                    onChange={(e) => setActiveUser(e.target.value)}
                                    className="bg-transparent text-xs font-black text-slate-800 focus:outline-none cursor-pointer"
                                >
                                    {['Manu', 'Oscar', 'Pablo', 'Externo', 'Álvaro', 'Silvia', 'Virginia'].map(u => <option key={u}>{u}</option>)}
                                </select>
                            </div>
                            <button onClick={() => setIsModalOpen(true)} className="bg-black text-white px-6 py-3 rounded-2xl flex items-center gap-2 text-xs font-black uppercase tracking-widest hover:scale-105 transition-all shadow-xl shadow-black/10">
                                <Icon name="plus" size={14} /> Nuevo Briefing
                            </button>
                        </div>
                    </header>

                    {error && (
                        <div className="bg-red-500 text-white text-[10px] font-black uppercase text-center py-2 tracking-[0.2em]">
                            {error}
                        </div>
                    )}

                    {}
                    <main className="flex-1 overflow-x-auto p-8 flex gap-8 custom-scroll bg-[#F8FAFC]">
                        {COLUMNS.map(col => (
                            <div key={col.id} className={`flex-shrink-0 w-80 rounded-[2.5rem] ${col.color} p-6 border border-slate-200/50 flex flex-col kanban-column`}>
                                <div className="flex items-center justify-between mb-8 px-2">
                                    <h3 className="text-[10px] font-black uppercase text-slate-400 tracking-[0.2em]">{col.label}</h3>
                                    <span className="bg-white px-3 py-1 rounded-full text-[10px] font-black text-slate-400 shadow-sm">{tasks.filter(t => t.status === col.id).length}</span>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto custom-scroll space-y-5 pr-1">
                                    {tasks.filter(t => t.status === col.id).map(task => {
                                        const urgent = isUrgent(task.deadline);
                                        return (
                                            <div key={task.id} className="bg-white p-5 rounded-[2rem] border border-slate-200/60 shadow-sm hover:shadow-xl transition-all group relative overflow-hidden">
                                                {urgent && task.status !== 'Done' && <div className="absolute top-0 left-0 w-full h-1 bg-red-500 animate-pulse" />}
                                                
                                                <div className="flex justify-between items-start mb-3">
                                                    <span className={`text-[8px] font-black px-2 py-1 rounded-lg uppercase tracking-widest ${urgent ? 'bg-red-100 text-red-600' : 'bg-slate-100 text-slate-400'}`}>
                                                        {urgent ? 'Urgente' : 'Normal'}
                                                    </span>
                                                    <div className="text-[10px] font-black text-slate-300">#{task.id.slice(0,4)}</div>
                                                </div>

                                                <h4 className="text-sm font-black text-slate-800 leading-tight mb-4 cursor-pointer hover:text-blue-600 transition-colors" onClick={() => setSelectedTask(task)}>
                                                    {task.title}
                                                </h4>

                                                <div className="flex flex-wrap gap-1.5 mb-5">
                                                    {task.formats?.slice(0,2).map((f, i) => (
                                                        <span key={i} className="bg-slate-50 text-[8px] font-black text-slate-400 px-2 py-1 rounded-md border border-slate-100 uppercase">{f}</span>
                                                    ))}
                                                    {task.formats?.length > 2 && <span className="text-[8px] font-black text-slate-300 px-1">+{task.formats.length - 2}</span>}
                                                </div>

                                                <div className="flex items-center justify-between pt-4 border-t border-slate-50">
                                                    <div className="flex items-center gap-1.5 text-[9px] font-black text-slate-400">
                                                        <Icon name="calendar" size={10} /> {task.deadline}
                                                    </div>
                                                    <div className="flex -space-x-2">
                                                        <div className="w-6 h-6 rounded-lg bg-slate-800 border-2 border-white flex items-center justify-center text-[8px] font-black text-white" title={`Solicita: ${task.client}`}>{task.client?.[0]}</div>
                                                        <div className={`w-6 h-6 rounded-lg border-2 border-white flex items-center justify-center text-[8px] font-black text-white ${task.producer === 'Pendiente' ? 'bg-slate-200' : 'bg-blue-600'}`}>{task.producer?.[0]}</div>
                                                    </div>
                                                </div>

                                                {/* Botones de acción contextuales */}
                                                <div className="mt-4 space-y-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                    {task.status === 'Backlog' && activeUser === 'Manu' && (
                                                        <div className="grid grid-cols-3 gap-1.5">
                                                            {PRODUCTORES.map(p => (
                                                                <button key={p} onClick={() => updateStatus(task.id, 'In Production', p)} className="bg-slate-900 text-white text-[8px] font-black py-2 rounded-lg hover:bg-blue-600 transition-colors uppercase">A {p}</button>
                                                            ))}
                                                        </div>
                                                    )}
                                                    {task.status === 'In Production' && PRODUCTORES.includes(activeUser) && (
                                                        <button onClick={() => updateStatus(task.id, 'Review')} className="w-full bg-blue-600 text-white text-[9px] font-black py-2.5 rounded-xl uppercase tracking-widest">Enviar a Revisión</button>
                                                    )}
                                                    {task.status === 'Review' && REVISORES.includes(activeUser) && (
                                                        <div className="flex gap-2">
                                                            <button onClick={() => setRejectingTask(task)} className="flex-1 bg-red-50 text-red-600 text-[9px] font-black py-2.5 rounded-xl uppercase">Ajustes</button>
                                                            <button onClick={() => updateStatus(task.id, 'Done')} className="flex-1 bg-emerald-600 text-white text-[9px] font-black py-2.5 rounded-xl uppercase shadow-lg shadow-emerald-200">Aprobar OK</button>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </main>

                    {}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <form onSubmit={createProject} className="bg-white rounded-[3rem] w-full max-w-xl shadow-2xl overflow-hidden border border-slate-200">
                                <div className="p-10 border-b border-slate-50 flex justify-between items-center">
                                    <h2 className="text-2xl font-black text-slate-800 tracking-tight">NUEVO BRIEFING</h2>
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="p-2 hover:bg-red-50 rounded-full transition-colors"><Icon name="x" size={24} /></button>
                                </div>
                                <div className="p-10 space-y-6 max-h-[60vh] overflow-y-auto custom-scroll">
                                    <input name="title" required placeholder="Nombre del proyecto..." className="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 text-sm font-bold focus:ring-2 focus:ring-black focus:outline-none" />
                                    <textarea name="description" placeholder="Objetivo del proyecto / Estética buscada..." className="w-full h-24 bg-slate-50 border-none rounded-2xl px-6 py-4 text-sm font-bold focus:ring-2 focus:ring-black focus:outline-none resize-none" />
                                    
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Responsable</label>
                                            <select name="client" className="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 text-sm font-black text-slate-700 focus:outline-none">
                                                {REVISORES.map(u => <option key={u}>{u}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-2 block">Deadline</label>
                                            <input name="deadline" type="date" required className="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 text-sm font-black focus:outline-none" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-2 mb-3 block">Formatos Requeridos</label>
                                        <div className="space-y-3">
                                            {formatoLines.map((line, index) => (
                                                <input key={index} value={line} onChange={(e) => {
                                                    const newLines = [...formatoLines];
                                                    newLines[index] = e.target.value;
                                                    setFormatoLines(newLines);
                                                }} placeholder="Ej: Vídeo 9:16 / Reels..." className="w-full bg-slate-50 border-none rounded-xl px-5 py-3 text-xs font-black shadow-inner" />
                                            ))}
                                            <button type="button" onClick={() => setFormatoLines([...formatoLines, ''])} className="w-full py-3 border-2 border-dashed border-slate-200 rounded-xl text-[10px] font-black text-slate-400 hover:border-black hover:text-black transition-all">+ AÑADIR FORMATO</button>
                                        </div>
                                    </div>

                                    <input name="assetUrl" type="url" placeholder="Link a Drive / Recursos..." className="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 text-sm font-bold" />
                                </div>
                                <div className="p-10 bg-slate-50">
                                    <button type="submit" className="w-full bg-black text-white py-5 rounded-[2rem] text-xs font-black uppercase tracking-widest shadow-2xl hover:scale-[0.98] transition-transform">Lanzar a Producción</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Detalle de Tarea (El diseño oscuro del 7 de mayo) */}
                    {selectedTask && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-sm flex items-center justify-center z-[110] p-4">
                            <div className="bg-white rounded-[3.5rem] w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="p-10 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-800 tracking-tight">{selectedTask.title}</h2>
                                        <p className="text-[10px] font-black text-slate-400 uppercase mt-2">Expediente de Proyecto</p>
                                    </div>
                                    <button onClick={() => setSelectedTask(null)} className="p-4 hover:bg-slate-200 rounded-full transition-all text-slate-400"><Icon name="x" size={28}/></button>
                                </div>
                                <div className="p-12 space-y-10 overflow-y-auto custom-scroll">
                                    {selectedTask.description && (
                                        <div className="bg-slate-900 text-white p-8 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
                                            <div className="flex items-center gap-3 mb-4 text-white/30">
                                                <Icon name="file-text" size={16} />
                                                <p className="text-[11px] font-black uppercase tracking-widest">Briefing & Objetivo</p>
                                            </div>
                                            <p className="text-sm font-medium leading-relaxed italic relative z-10">{selectedTask.description}</p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Partner Briefing</p>
                                            <p className="text-sm font-black text-slate-800">{selectedTask.client}</p>
                                        </div>
                                        <div className="bg-slate-50 p-6 rounded-3xl">
                                            <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Asignado</p>
                                            <p className="text-sm font-black text-slate-800">{selectedTask.producer}</p>
                                        </div>
                                    </div>

                                    <div>
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-4 ml-2">Formatos</p>
                                        <div className="flex flex-wrap gap-2">
                                            {selectedTask.formats?.map((f, i) => (
                                                <span key={i} className="bg-white px-4 py-2 rounded-xl border border-slate-200 text-xs font-black shadow-sm uppercase">{f}</span>
                                            ))}
                                        </div>
                                    </div>

                                    {selectedTask.assetUrl && (
                                        <a href={selectedTask.assetUrl} target="_blank" className="block w-full bg-blue-50 text-blue-600 py-4 rounded-2xl text-center text-xs font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition-all">Acceder a Materiales</a>
                                    )}

                                    <div className="space-y-4">
                                        <div className="flex items-center gap-2 mb-2 ml-2">
                                            <Icon name="message-square" size={16} className="text-amber-500" />
                                            <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Historial de Ajustes</span>
                                        </div>
                                        {selectedTask.comments?.map((c, i) => (
                                            <div key={i} className="bg-amber-50/50 p-4 rounded-2xl border border-amber-100 text-[11px] font-bold text-slate-700 leading-relaxed italic">
                                                {c}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal de Ajustes/Rechazo */}
                    {rejectingTask && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-[120] p-4">
                            <div className="bg-white rounded-[3rem] w-full max-w-md shadow-2xl p-10">
                                <h2 className="text-2xl font-black text-red-600 mb-6">Motivo del Ajuste</h2>
                                <textarea value={rejectFeedback} onChange={(e) => setRejectFeedback(e.target.value)} placeholder="¿Qué hay que cambiar?" className="w-full h-40 bg-slate-50 border-none rounded-3xl p-6 text-sm font-bold focus:ring-2 focus:ring-red-500 outline-none resize-none mb-6" />
                                <div className="flex gap-4">
                                    <button onClick={() => setRejectingTask(null)} className="flex-1 py-4 text-xs font-black uppercase text-slate-400">Cancelar</button>
                                    <button onClick={() => updateStatus(rejectingTask.id, 'In Production', null, rejectFeedback)} className="flex-[2] bg-red-600 text-white py-4 rounded-2xl text-xs font-black uppercase tracking-widest shadow-xl shadow-red-200">Devolver a Producción</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
