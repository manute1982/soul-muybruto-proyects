<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Soul Agency x MuyBruto | HQ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .sticky-nav {
            position: sticky;
            top: 0;
            z-index: 50;
        }
    </style>
</head>
<body class="overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        // Configuración de Firebase proporcionada por el usuario
        const firebaseConfig = {
            apiKey: "AIzaSyAsI1K6ukfJie1c5D1p_pGXQv6F4mFIoSg",
            authDomain: "soul-5b742.firebaseapp.com",
            projectId: "soul-5b742",
            storageBucket: "soul-5b742.firebasestorage.app",
            messagingSenderId: "712886103290",
            appId: "1:712886103290:web:de65db959c06d89d0aad43"
        };

        const currentAppId = 'soul-agency-app';

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        
        const db = firebase.firestore();
        const auth = firebase.auth();

        const { useState, useEffect, useMemo } = React;

        const USER_MAP = {
            "mquiroga@thesoul.agency": { name: "Manu", role: "REVISOR" },
            "o.noriegastudio@gmail.com": { name: "Oscar", role: "PRODUCTOR" },
            "alopez@thesoul.agency": { name: "Álvaro", role: "REVISOR" },
            "spina@thesoul.agency": { name: "Silvia", role: "REVISOR" },
            "vmartinez@thesoul.agency": { name: "Virginia", role: "REVISOR" }
        };

        const COLUMNS = [
            { id: 'Backlog', label: 'Buzón / Briefing', color: 'bg-slate-100/50' },
            { id: 'In Production', label: 'En Producción', color: 'bg-blue-50/50' },
            { id: 'Review', label: 'Revisión Partners', color: 'bg-amber-50/50' },
            { id: 'Done', label: 'Completado', color: 'bg-emerald-50/50' }
        ];

        const Icon = {
            Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4"/></svg>,
            Link: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>,
            Calendar: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
            X: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"/></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            SoulLogo: () => (
                <div className="relative flex items-center justify-center p-2 bg-black rounded-xl shadow-lg">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                        <path d="M12 2l.3-.8c.2-.6.9-.9 1.5-.7l.8.3c.6.2.9.9.7 1.5l-.3.8" opacity="0.4" />
                        <rect x="4" y="8" width="16" height="11" rx="2" strokeWidth="2"/>
                        <path d="M9 8V6a1 1 0 011-1h4a1 1 0 011 1v2" strokeWidth="2" />
                        <circle cx="12" cy="13.5" r="3" strokeWidth="2" />
                    </svg>
                </div>
            )
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [tasks, setTasks] = useState([]);
            const [loading, setLoading] = useState(true);
            const [authError, setAuthError] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedTask, setSelectedTask] = useState(null);
            const [showUserPicker, setShowUserPicker] = useState(false);
            const [formFormats, setFormFormats] = useState(['']);
            const [actionModal, setActionModal] = useState({ show: false, type: null, task: null, comment: '' });

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await auth.signInAnonymously();
                    } catch (err) {
                        console.error("Error de Firebase Auth:", err);
                        // Si el error es admin-restricted, informamos al usuario
                        if (err.code === 'auth/admin-restricted-operation') {
                            setAuthError("El inicio de sesión anónimo está desactivado en la consola de Firebase.");
                        }
                        // Forzamos un perfil de invitado para permitir ver la UI
                        setProfile({ name: "Invitado", role: "VISITANTE" });
                        setLoading(false);
                    }
                };
                initAuth();
                
                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        const userProfile = u.email ? USER_MAP[u.email.toLowerCase()] : null;
                        if (userProfile) setProfile(userProfile);
                        else {
                            const saved = localStorage.getItem('soul_agency_user_name');
                            const found = Object.values(USER_MAP).find(v => v.name === saved);
                            setProfile(found || { name: "Invitado", role: "VISITANTE" });
                        }
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user && !profile) return;
                const unsubscribe = db.collection('artifacts').doc(currentAppId).collection('public').doc('data').collection('tasks')
                    .onSnapshot(snap => setTasks(snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))), err => {
                        console.error("Error de Firestore:", err);
                    });
                return () => unsubscribe();
            }, [user, profile]);

            if (loading) return <div className="h-screen flex flex-col items-center justify-center font-black uppercase text-slate-300 italic animate-pulse">
                <Icon.SoulLogo />
                <p className="mt-4">Iniciando HQ...</p>
            </div>;

            return (
                <div className="h-screen flex flex-col overflow-hidden">
                    {/* AVISO DE ERROR DE CONFIGURACIÓN */}
                    {authError && (
                        <div className="bg-red-500 text-white text-[10px] font-black uppercase tracking-widest py-2 px-10 text-center animate-bounce">
                            ⚠️ Error de Configuración: {authError} (Habilita 'Anonymous Auth' en Firebase Console)
                        </div>
                    )}

                    {/* MODAL DETALLE PROYECTO */}
                    {selectedTask && (
                        <div className="fixed inset-0 bg-slate-900/95 backdrop-blur-xl flex items-center justify-center p-6 z-[110]" onClick={() => setSelectedTask(null)}>
                            <div className="bg-white rounded-[3.5rem] w-full max-w-5xl shadow-2xl overflow-hidden flex h-[85vh] animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                                <div className="flex-1 p-12 overflow-y-auto custom-scroll">
                                    <div className="flex justify-between items-start mb-10">
                                        <div>
                                            <p className="text-[10px] font-black uppercase text-blue-500 tracking-widest mb-2">{selectedTask.client}</p>
                                            <h2 className="text-4xl font-black text-slate-800 tracking-tighter uppercase leading-tight">{selectedTask.title}</h2>
                                        </div>
                                        <button onClick={() => setSelectedTask(null)} className="p-3 bg-slate-50 rounded-2xl text-slate-400 hover:text-red-500 transition-colors"><Icon.X /></button>
                                    </div>
                                    
                                    <div className="bg-slate-900 text-white p-10 rounded-[2.5rem] mb-10">
                                        <p className="text-sm font-medium italic leading-relaxed text-slate-300">{selectedTask.description}</p>
                                    </div>

                                    <div className="grid grid-cols-2 gap-10">
                                        <div>
                                            <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Materiales / Formatos</h4>
                                            <div className="flex flex-wrap gap-2">
                                                {selectedTask.formats?.map((f, i) => (
                                                    <span key={i} className="bg-slate-50 text-slate-600 px-4 py-2 rounded-xl text-xs font-black border border-slate-100 uppercase">{f}</span>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <h4 className="text-[10px] font-black uppercase text-slate-400 tracking-widest mb-4">Materiales</h4>
                                            {selectedTask.assetUrl ? (
                                                <a href={selectedTask.assetUrl} target="_blank" className="flex items-center justify-center gap-3 bg-blue-600 text-white px-8 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl hover:bg-blue-700 transition-all">Abrir Link <Icon.Link /></a>
                                            ) : (
                                                <div className="p-5 border-2 border-dashed border-slate-100 rounded-2xl text-slate-300 text-[10px] font-black uppercase text-center">Sin link</div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="w-80 bg-slate-50/50 p-10 flex flex-col border-l border-slate-100">
                                    <h3 className="text-[10px] font-black uppercase mb-8 tracking-widest text-slate-400">Log de Actividad</h3>
                                    <div className="flex-1 overflow-y-auto custom-scroll space-y-8 pr-2">
                                        {selectedTask.logs?.slice().reverse().map((log, i) => (
                                            <div key={i} className="relative pl-6 border-l-2 border-slate-200">
                                                <div className="absolute -left-[5px] top-0 w-2 h-2 rounded-full bg-slate-300"></div>
                                                <p className="text-[9px] font-black uppercase text-slate-800">{log.user}</p>
                                                <p className="text-[11px] text-slate-500 leading-tight mt-1.5 font-medium">{log.action}</p>
                                                <p className="text-[8px] font-bold text-slate-300 mt-2">{new Date(log.date).toLocaleDateString()} {new Date(log.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL FEEDBACK / ENTREGA */}
                    {actionModal.show && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-md flex items-center justify-center p-4 z-[200]">
                            <div className="bg-white rounded-[3rem] p-10 w-full max-w-lg shadow-2xl">
                                <h3 className="text-2xl font-black text-slate-800 tracking-tighter mb-4 uppercase">{actionModal.type === 'SEND_REVIEW' ? '🚀 Entrega' : '🛑 Ajustes'}</h3>
                                <textarea className="w-full h-32 bg-slate-50 rounded-2xl p-6 text-sm font-medium border-2 border-transparent focus:border-blue-100 outline-none mb-6 resize-none" placeholder="Escribe tus comentarios aquí..." value={actionModal.comment} onChange={(e) => setActionModal({...actionModal, comment: e.target.value})} />
                                <div className="flex gap-4">
                                    <button onClick={() => setActionModal({show: false})} className="flex-1 py-5 text-[10px] font-black uppercase text-slate-400">Cancelar</button>
                                    <button onClick={() => updateStatus(actionModal.task.id, actionModal.type === 'SEND_REVIEW' ? 'Review' : 'In Production', null, actionModal.comment)} className={`flex-1 py-5 rounded-2xl text-[10px] font-black uppercase text-white shadow-lg ${actionModal.type === 'SEND_REVIEW' ? 'bg-amber-500' : 'bg-red-500'}`}>Enviar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SELECTOR DE USUARIO */}
                    {showUserPicker && (
                        <div className="absolute top-20 right-8 bg-white border border-slate-100 shadow-2xl rounded-3xl p-6 z-[100] w-64 animate-in fade-in slide-in-from-top-4 duration-200">
                            <p className="text-[10px] font-black uppercase text-slate-400 mb-4 tracking-widest">Cambiar Perfil</p>
                            {Object.values(USER_MAP).map((p, i) => (
                                <button key={i} onClick={() => selectProfile(p)} className="w-full text-left p-3 rounded-xl hover:bg-slate-50 flex items-center justify-between group mb-1">
                                    <span className="text-xs font-black text-slate-700">{p.name}</span>
                                    <span className="text-[8px] font-black uppercase text-slate-300">{p.role}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
